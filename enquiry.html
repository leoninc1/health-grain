<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Custom Cake &amp; Catering Enquiry | Hearth &amp; Grain Bakery</title>
    <meta name="description" content="Enquire about a custom celebration cake or catering order. Get an instant cost estimate and availability check.">
    <meta name="theme-color" content="#443d3a">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Custom Cake &amp; Catering Enquiry | Hearth &amp; Grain Bakery">
    <meta property="og:description" content="Enquire about a custom celebration cake or catering order. Get an instant cost estimate and availability check.">

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<header>

    <nav class="navbar">

        <div class="logo">
           <picture>
                <source type="image/webp" srcset="images/logo-160.webp 160w, images/logo-320.webp 320w" sizes="80px">
                <img src="images/logo-160.png" srcset="images/logo-160.png 160w, images/logo-320.png 320w" sizes="80px" width="160" height="160" alt="Hearth & Grain Bakery">
            </picture>
        </div>

        <button type="button" class="nav-toggle" aria-label="Open menu" aria-expanded="false" aria-controls="navLinks">&#9776;</button>

        <ul class="nav-links" id="navLinks">

            <li><a href="index.html">Home</a></li>

            <li><a href="about.html">About Us</a></li>

            <li><a href="product.html">Products</a></li>

            <li><a href="gallery.html">Gallery</a></li>
            <li><a href="enquiry.html">Enquire</a></li>

            <li><a href="contact.html">Contact</a></li>

        </ul>

    </nav>

</header>


<section class="page-header">

    <h1>Make an Enquiry</h1>

    <p>
        Tell us about your custom cake or catering request.
    </p>

</section>


<section class="form-section">

    <form id="enquiryForm" action="https://formspree.io/f/YOUR_FORM_ID" method="post" novalidate>

        <label for="name">Full Name</label>

        <input type="text"
               id="name"
               name="name"
               required>


        <label for="email">Email Address</label>

        <input type="email"
               id="email"
               name="email"
               required>


        <label for="phone">Phone Number</label>

        <input type="tel"
               id="phone"
               name="phone">


        <label for="type">Enquiry Type</label>

        <select id="type" name="type">

            <option value="cake">
                Custom Cake
            </option>

            <option value="catering">
                Catering
            </option>

            <option value="other">
                Other
            </option>

        </select>


        <label for="quantity">Servings / Guests</label>

        <input type="number" id="quantity" name="quantity" min="1" max="500" value="10">


        <label for="date">Date Needed</label>

        <input type="date" id="date" name="date">


        <label for="message">Message</label>

        <textarea id="message"
                  name="message"
                  rows="6"
                  required></textarea>


        <button type="submit" class="button">
            Send Enquiry
        </button>

    </form>

    <div id="enquiryResult" class="result-box" aria-live="polite"></div>

</section>


<footer>

    <p>&copy; 2026 Hearth & Grain Bakery</p>

</footer>

<script src="js/script.js"></script>

</body>

</html>
