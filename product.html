<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bakery Products &amp; Prices | Hearth &amp; Grain Bakery</title>
    <meta name="description" content="Browse and search our sourdough, croissants, muffins, cinnamon rolls, chocolate cake and carrot cake with prices.">
    <meta name="theme-color" content="#443d3a">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Bakery Products &amp; Prices | Hearth &amp; Grain Bakery">
    <meta property="og:description" content="Browse and search our sourdough, croissants, muffins, cinnamon rolls, chocolate cake and carrot cake with prices.">

    <link rel="stylesheet" href="css/style.css">

    <style>

        .products-section {
            padding: 50px 8%;
        }

        .products-section h2 {
            text-align: center;
            font-family: Georgia, serif;
            font-size: 32px;
            margin-bottom: 35px;
        }

        .products {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
        }

        .product-card {
            background-color: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 3px 10px rgba(0,0,0,0.15);
        }

        .product-card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            display: block;
        }

        .product-info {
            padding: 18px;
        }

        .product-info h3 {
            font-family: Georgia, serif;
            font-size: 21px;
            margin-bottom: 8px;
        }

        .product-info p {
            font-size: 15px;
            margin-bottom: 12px;
        }

        .price {
            font-size: 18px;
            font-weight: bold;
            color: #C97C4B;
        }

        .custom-cakes {
            text-align: center;
            padding: 60px 20px;
            background-color: #C97C4B;
        }

        .custom-cakes h2 {
            font-family: Georgia, serif;
            margin-bottom: 15px;
        }

        .custom-cakes p {
            margin-bottom: 15px;
        }

        @media (max-width: 900px) {

            .products {
                grid-template-columns: repeat(2, 1fr);
            }

        }

        @media (max-width: 600px) {

            .products {
                grid-template-columns: 1fr;
            }

            .product-card img {
                height: 200px;
            }

        }

    </style>

</head>


<body>


<header>

    <nav class="navbar">

        <div class="logo">
            <picture>
                <source type="image/webp" srcset="images/logo-160.webp 160w, images/logo-320.webp 320w" sizes="80px">
                <img src="images/logo-160.png" srcset="images/logo-160.png 160w, images/logo-320.png 320w" sizes="80px" width="160" height="160" alt="Hearth & Grain Bakery">
            </picture>
        </div>


        <button type="button" class="nav-toggle" aria-label="Open menu" aria-expanded="false" aria-controls="navLinks">&#9776;</button>

        <ul class="nav-links" id="navLinks">

            <li>
                <a href="index.html">Home</a>
            </li>

            <li>
                <a href="about.html">About Us</a>
            </li>

            <li>
                <a href="product.html">Products</a>
            </li>

            <li><a href="gallery.html">Gallery</a></li>
            <li>
                <a href="enquiry.html">Enquire</a>
            </li>

            <li>
                <a href="contact.html">Contact</a>
            </li>

        </ul>

    </nav>

</header>



<section class="page-header">

    <h1>Our Products</h1>

    <p>
        Freshly baked every day with quality ingredients.
    </p>

</section>



<section class="products-section">

    <h2>Fresh Bakery</h2>


    <div class="toolbar">
        <label class="sr-only" for="searchBox">Search products</label>
        <input type="search" id="searchBox" placeholder="Search products...">
        <label class="sr-only" for="categoryFilter">Filter by category</label>
        <select id="categoryFilter">
            <option value="all">All categories</option>
            <option value="bread">Bread</option>
            <option value="pastry">Pastries</option>
            <option value="cake">Cakes</option>
        </select>
        <label class="sr-only" for="sortSelect">Sort products</label>
        <select id="sortSelect">
            <option value="default">Sort: Featured</option>
            <option value="price-asc">Price: low to high</option>
            <option value="price-desc">Price: high to low</option>
            <option value="name">Name: A to Z</option>
        </select>
    </div>

    <p id="resultCount" aria-live="polite"></p>

    <div class="products" id="productGrid">
        <noscript><p>Please enable JavaScript to view our products.</p></noscript>
    </div>

</section>



<section class="custom-cakes">

    <h2>Custom Celebration Cakes</h2>

    <p>
        Need a cake for a birthday, wedding,
        anniversary or special event?
    </p>

    <a href="enquiry.html" class="button">
        Make a Cake Enquiry
    </a>

</section>



<footer>

    <p>
        &copy; 2026 Hearth & Grain Bakery
    </p>

</footer>


<script src="js/script.js"></script>

</body>

</html>
